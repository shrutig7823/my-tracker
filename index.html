<style>

:root[data-theme="dark"]{

  --ok:#4CC38A; --ok-soft:#14301F; --warn:#E0A04A; --warn-soft:#33260F; --bad:#F0786B; --bad-soft:#3A1B18; --t1:#7BA3FF; --t2:#B896F0; --t3:#4CC38A; --t4:#E0A04A; --t5:#4FC3CB; --t6:#F08BB4; color-scheme:dark}
*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:24px 16px 20px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:var(--surface)}

.nav a:hover,.nav button:hover{color:var(--ink);background:var(--bg)}

main{min-width:0;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px 32px;max-width:980px}

.fbrow{display:flex;gap:10px;align-items:flex-start}

.imp{margin-top:8px;font-size:13px;color:var(--muted)}

.daywrap{display:flex;flex-direction:column;gap:14px;min-width:0}

.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

.day.l2{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}

.day.fut{opacity:.45}
.day.now .dn{color:var(--accent)}

.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.dots{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid var(--line);background:transparent}

.badge.t1{background:var(--t1)}.badge.t2{background:var(--t2)}.badge.t3{background:var(--t3)}.badge.t4{background:var(--t4)}
.panel.task{border-top:4px solid var(--line)}
.panel.task.t1{border-top-color:var(--t1)}.panel.task.t2{border-top-color:var(--t2)}.panel.task.t3{border-top-color:var(--t3)}.panel.task.t4{border-top-color:var(--t4)}
.panel.hero{background:var(--accent-soft);border-color:transparent}
ol.next{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.item.isnext{background:var(--accent-soft);margin:0 -10px;padding:14px 10px;border-radius:6px;border-top-color:transparent}
.bar i.s3{background:var(--t3)}
.bar i.s4{background:var(--ok)}.bar i.s5{background:var(--ok)}
details>summary{cursor:pointer;color:var(--muted);font-size:13px}
pre.wrap{white-space:pre-wrap;font-family:var(--font-ui);margin:0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}

function tDone(d,id){
  const T=S.track;
  if(id==="read")return pagesOn(d)>0;
  if(id==="app")return (T.steps||[]).some(s=>s.done&&s.doneOn===d)||!!((T.appWorked||{})[d]);
  if(id==="web"||id==="ai")return learnOn(d,id).length>0;
  if(id==="prac")return PRAC.some(p=>pracOn(d,p[0])>0);
  if(id==="emp")return !!empOn(d).type;
  return false;
}

function chartDaily(){
  const t=today(),y=+t.slice(0,4),m=+t.slice(5,7),nd=new Date(y,m,0).getDate(),td=+t.slice(8);
  const W=640,H=170,pl=36,pr=14,pt=14,pb=24;
  const X=i=>pl+(nd>1?i/(nd-1):0)*(W-pl-pr),Y=p=>pt+(1-p/100)*(H-pt-pb);
  const pts=[];for(let i=1;i<=td;i++){const v=hPct(t.slice(0,8)+String(i).padStart(2,"0"));pts.push([X(i-1),Y(v),v])}
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Daily completion this month">';
  [0,50,100].forEach(v=>{s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/>'+svgText(pl-6,Y(v)+4,v+"%","end")});
  [1,8,15,22,29].filter(d=>d<=nd).forEach(d=>{s+=svgText(X(d-1),H-6,d)});
  if(pts.length>1){
    s+='<path d="M'+pts[0][0]+' '+Y(0)+' L'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(" L")+' L'+pts[pts.length-1][0]+' '+Y(0)+' Z" fill="var(--accent-soft)"/>'
      +'<path d="M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(" L")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  }

  s+='<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4.5" fill="var(--accent)"/>'+svgText(Math.min(last[0],W-pr-10),Math.max(last[1]-10,pt+8),last[2]+"%","middle",' style="fill:var(--ink)"');
  return s+'</svg>';
}
function chartWeekly(){
  const t=today(),W=640,H=170,pl=36,pr=14,pt=18,pb=24;const mons=[];for(let i=4;i>=0;i--)mons.push(addDays(mon(t),-7*i));
  const vals=mons.map(m=>{let sum=0,n=0;for(let i=0;i<7;i++){const d=addDays(m,i);if(d<=t){sum+=hPct(d);n++}}return n?Math.round(sum/n):0});
  const Y=p=>pt+(1-p/100)*(H-pt-pb),band=(W-pl-pr)/mons.length,bw=Math.min(54,band*.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weekly completion, last five weeks">';
  [0,50,100].forEach(v=>{s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/>'+svgText(pl-6,Y(v)+4,v+"%","end")});
  mons.forEach((m,i)=>{const cx=pl+band*i+band/2,y=Y(vals[i]);
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(0,Y(0)-y)+'" rx="3" fill="'+(i===mons.length-1?"var(--accent)":"var(--muted)")+'" opacity="'+(i===mons.length-1?1:.55)+'"/>'
      +svgText(cx,y-5,vals[i]+"%","middle",' style="fill:var(--ink)"')+svgText(cx,H-6,fmtD(parseD(m).getTime()))});
  return s+'</svg>';
}

          if(!s.exists||s.metadata.hasPendingWrites||dirty||saving)return;

    try{const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(d){await d.save({filename:name,data:json});ok=true}}catch(err){}

    say(ok?"Backup file requested. If nothing downloaded, use Copy backup instead.":"Could not save a file here. Use Copy backup instead.")}
  else if(a==="bcancel"){ui.bkConfirm=false;render()}
  else if(a==="brestore"){const txt=(document.getElementById("bk-in").value||"").trim();let obj=null;
    try{obj=JSON.parse(txt)}catch(err){}
    const data=obj&&(obj.data||obj);
    if(!data||typeof data!=="object"||!("interviews" in data||"track" in data||"cases" in data))say("That does not look like a backup. Paste the full text you copied.");
    else if(!ui.bkConfirm){ui.bkConfirm=true;ui.bkPending=data;render();const b=document.getElementById("bk-in");if(b)b.value=txt}
    else{S=merge(DEF(),clone(ui.bkPending||data));ui.bkConfirm=false;ui.bkPending=null;localSave();dirty=true;flush();say("Restored. Everything now matches the backup.")}}
  else if(a==="sub"){ui[t.dataset.k]=v;ui.msg="";ui.drill=null;render()}
  else if(a==="jump"){const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="rlog"){const pg=parseInt(document.getElementById("rd-pages").value,10)||0,tk=document.getElementById("rd-take").value.trim(),ap=document.getElementById("rd-apply").value.trim();
    if(pg<1)say("Enter how many pages you read.");
    else if(tk.length<10)say("Write one takeaway in your own words, at least a short sentence.");
    else{const bk=S.focus.book;bk.log=(bk.log||[]).concat([{date:ui.date,pages:pg,takeaway:tk,apply:ap}]);setP("track.pages."+ui.date,pagesOn(ui.date)+pg);log("reading",pg+" pages"+(bk.title?" of "+bk.title:"")+": "+tk,["empathy","depth","rehearsed"]);render()}}
  else if(a==="tday"){ui.tday=v;render()}
  else if(a==="tgo"){ui.tday=today();ui.tmon=0;render()}
  else if(a==="tstep1"){const d=addDays(ui.tday||today(),+v);ui.tday=d;const b=parseD(today());const dd=parseD(d);ui.tmon=(dd.getFullYear()-b.getFullYear())*12+dd.getMonth()-b.getMonth();render()}
  else if(a==="tmon"){ui.tmon=(ui.tmon||0)+(+v);render()}
  else if(a==="tpg"){const d=ui.tday||today();setP("track.pages."+d,pagesOn(d)+(+v));render()}
  else if(a==="tsadd"){const x=(document.getElementById("ts-text").value||"").trim();if(!x)say("Type the step first.");else{S.track.steps=(S.track.steps||[]).concat([{text:x,done:false,doneOn:""}]);schedule();render()}}
  else if(a==="tsdeploy"){S.track.steps=(S.track.steps||[]).concat(DEPLOY.map(x=>({text:x[1],done:false,doneOn:""})));schedule();render()}
  else if(a==="tsdel"){S.track.steps.splice(+v,1);schedule();render()}
  else if(a==="tchip"){const el=document.getElementById("tl-"+v+"-topic");if(el)el.value=t.dataset.t;if(el)el.focus()}
  else if(a==="tladd"){const d=ui.tday||today(),tp=(document.getElementById("tl-"+v+"-topic").value||"").trim();
    if(tp.length<3)say("Write what you learned, or tap one of the topics.");
    else{const ms=parseInt(document.getElementById("tl-"+v+"-mins").value,10)||0,lk=(document.getElementById("tl-"+v+"-link").value||"").trim();
      setP("track.learn."+d+"."+v,learnOn(d,v).concat([{topic:tp,mins:ms,link:lk}]));log("task:tech",LEARN[v].title+": "+tp+(ms?" ("+ms+" min)":""),["tech"]);render()}}
  else if(a==="tldel"){const d=ui.tday||today(),arr=learnOn(d,v).slice();arr.splice(+t.dataset.i,1);setP("track.learn."+d+"."+v,arr);render()}
  else if(a==="tprac"){const d=ui.tday||today();setP("track.prac."+d+"."+v,Math.max(0,pracOn(d,v)+(+t.dataset.d)));render()}
  else if(a==="temp"){const d=ui.tday||today();const cur=empOn(d).type;setP("track.emp."+d+".type",cur===v?"":v);if(cur!==v)log("task:product","User empathy: "+v,["empathy"]);render()}
  else if(a==="ipick"){ui.iv=v;ui.cdel=null;ui.ivEdit=false;ui.ivAdd=false;render()}
  else if(a==="iaddtoggle"){ui.ivAdd=!ui.ivAdd;render()}
  else if(a==="iedit"){ui.ivEdit=!ui.ivEdit;ui.cdel=null;render()}
  else if(a==="irate"){const iv=S.interviews[ivIdx()];iv.rating=(iv.rating===+v)?0:+v;schedule();render()}
  else if(a==="iverd"){S.interviews[ivIdx()].qa[+t.dataset.q].verdict=+v;schedule();render()}
  else if(a==="iadd"){const el=document.getElementById("nv-company"),c=(el.value||"").trim();
    if(!c)say("Type the company name first.");else{const iv=newIv({company:c});S.interviews.push(iv);ui.iv=iv.id;ui.ivAdd=false;ui.ivEdit=true;schedule();render()}}
  else if(a==="iqadd"){S.interviews[ivIdx()].qa.push({q:"",a:"",fb:"",imp:"",tags:[]});schedule();render()}
  else if(a==="iqdel"){if(ui.cdel==="q"+v){S.interviews[ivIdx()].qa.splice(+v,1);ui.cdel=null;schedule()}else ui.cdel="q"+v;render()}
  else if(a==="itag"){const q=S.interviews[ivIdx()].qa[+t.dataset.q];q.tags=q.tags||[];const j=q.tags.indexOf(v);if(j>=0)q.tags.splice(j,1);else q.tags.push(v);schedule();render()}
  else if(a==="iaadd"){const el=document.getElementById("ia-text"),x=(el.value||"").trim();if(!x)say("Type what you want to practice.");else{S.interviews[ivIdx()].actions.push({text:x,done:false});schedule();render()}}
  else if(a==="iadel"){S.interviews[ivIdx()].actions.splice(+v,1);schedule();render()}
  else if(a==="idel"){if(ui.cdel==="iv"){S.interviews.splice(ivIdx(),1);ui.cdel=null;ui.ivEdit=false;schedule()}else ui.cdel="iv";render()}
  else if(a==="irecap")recapIv();
  else if(a==="cw-open"){ui.openCourse=ui.openCourse===+v?-1:+v;render()}
  else if(a==="alog"){const kind=document.getElementById("al-kind").value,tx=document.getElementById("al-text").value.trim();
    if(tx.length<8)say("Describe what happened in at least a short sentence.");
    else{S.app.log=(S.app.log||[]).concat([{ts:Date.now(),kind,text:tx.slice(0,300)}]);log("app:"+kind,tx,["building"]);render()}}
  else if(a==="fb-open"){ui.openFb=ui.openFb===v?null:v;render()}
  else if(a==="fb-add"){const el=document.getElementById("ev-"+v),x=(el.value||"").trim();if(x.length<10){say("Describe the evidence in at least a short sentence.");return}
    if(!S.feedback[v])S.feedback[v]={level:0,evidence:[]};if(!S.feedback[v].evidence)S.feedback[v].evidence=[];S.feedback[v].evidence.push({ts:Date.now(),text:x});log("evidence",FEEDBACK.find(f=>f.id===v).name+": "+x,[v]);render()}
  else if(a==="day"){ui.date=v==="0"?today():addDays(ui.date,+v);render()}
  else if(a==="sk-open"){ui.openSkill=ui.openSkill===v?null:v;ui.drill=null;render()}
  else if(a==="surf"){ui.surface=v;render()}
  else if(a==="ctype"){ui.coach.type=v;render()}
  else if(a==="cask")askCase();
  else if(a==="cgrade")gradeCase();
  else if(a==="cskip"){ui.coach=Object.assign(ui.coach,{status:"idle",question:"",answer:"",result:null,err:""});render()}
  else if(a==="drill")askDrill(t.dataset.k,v);
  else if(a==="dgrade")gradeDrill();
  else if(a==="mdraft"){ui.mentor=draftMentor();render()}
  else if(a==="mq")suggestQ();
  else if(a==="msave"){const m=ui.mentor;if(!m.question.trim()){say("Add the question for your mentor first.");return}S.mentor.push(Object.assign({ts:Date.now()},clone(m)));ui.mentor=null;schedule();say("Update saved.")}
  else if(a==="mcopy"){const txt=mentorText(ui.mentor);try{await navigator.clipboard.writeText(txt);say("Copied.")}catch(err){const el=document.getElementById("mq");say("Copy was blocked. Select the text in each box and copy it.")}}
});
window.addEventListener("hashchange",route);

/* ---------- Claude flows ---------- */
async function askCase(){
  const c=ui.coach;c.status="asking";c.err="";c.result=null;c.answer="";render();
  const recent=S.cases.slice(-5).map(x=>x.question).join("\n- ");
  try{
    const r=await askJson("You are a demanding product-management interviewer preparing a candidate for a re-round at FirstClub.\n"+FC_CONTEXT+"\nWrite ONE interview question of type: "+c.type+". It must be realistic, specific to FirstClub, and answerable in 10 minutes. Do not include hints, frameworks, sub-bullets or the expected answer. For RCA, state the metric movement with plausible figures. For technical product, ask about a concrete feature.\nAvoid repeating these earlier questions:\n- "+(recent||"none")+"\nReply with only JSON: {\"question\": \"...\"}","quick");
    c.question=String(r.question||"");c.status=c.question?"answering":"idle";if(!c.question)c.err="No question came back. Try again.";
  }catch(e){c.status="idle";c.err=errCopy(e)}
  render();
}
async function gradeCase(){
  const c=ui.coach;if((c.answer||"").trim().length<40){c.err="Write a fuller answer before submitting.";render();return}
  c.status="grading";c.err="";render();
  try{
    const r=await askJson("You are a demanding product-management interviewer. The candidate has these known gaps: solves from own lens, scattered structure, stops at first-order answers, thin technical depth, sounds framework-recited.\nQuestion type: "+c.type+"\nQuestion: "+c.question+"\n\nCandidate answer:\n"+c.answer.slice(0,8000)+"\n\nScore ONLY what is written, 1 to 5 each (1 missing, 3 competent, 5 interview-ready; do not inflate; a missing dimension is 1). Dimensions: empathy (names a behavioral user, context, evidence vs assumption), structure (listener always knows problem, user, priority, first move), prioritization (picks one problem and justifies it), depth (alternatives rejected, edge cases, what V1 excludes), technical (API, service, state, events, failure, caching, logging where relevant), metrics (success metric, guardrails, instrumentation), tradeoffs. Flag in notes if it sounded like a recited framework.\nFor probes, write 3 follow-up questions an interviewer would ask next, chosen from gaps in this answer, preferring these technical probes where relevant: "+TECH_Q.join("; ")+"\nReply with only JSON: {\"scores\":{\"empathy\":n,\"structure\":n,\"prioritization\":n,\"depth\":n,\"technical\":n,\"metrics\":n,\"tradeoffs\":n},\"strongest\":\"one sentence\",\"weakest\":\"one sentence\",\"notes\":\"2-4 sentences\",\"probes\":[\"...\",\"...\",\"...\"]}","default");
    const sc={};DIMS.forEach(d=>{sc[d[0]]=Math.max(1,Math.min(5,Math.round(+(r.scores||{})[d[0]]||1)))});
    c.result={scores:sc,strongest:String(r.strongest||""),weakest:String(r.weakest||""),notes:String(r.notes||""),probes:(r.probes||[]).slice(0,3).map(String)};
    S.cases.push({ts:Date.now(),type:c.type,question:c.question,answer:c.answer.slice(0,6000),scores:sc,weakest:c.result.weakest});
    log("case",c.type+" case, mean "+dimMean(sc).toFixed(1),["empathy","structure","depth","rehearsed"]);
    c.status="done";
  }catch(e){c.status="answering";c.err=errCopy(e)}
  render();
}
async function askDrill(kind,id){
  const item=kind==="skill"?SKILLS.find(s=>s[0]===id):PROJECTS.find(p=>p.id===id);
  const name=kind==="skill"?item[1]:item.name,ctx=kind==="skill"?item[2]:item.scope;
  ui.drill={kind,id,status:"asking",question:"",answer:"",result:null,err:"",name,ctx};render();
  try{
    const r=await askJson("You are a technical interviewer testing a product manager's technical depth. The candidate is building their own independent app"+((S.app.problem||{}).problem?" that solves this problem: "+S.app.problem.problem:"")+".\nTopic: "+(kind==="skill"?"the concept '"+name+"' as it applies to their app ("+ctx+")":"the candidate's own project '"+name+"' ("+ctx+")")+".\nWrite ONE follow-up question that needs a concrete mechanism-level answer (what is called, where state lives, what fails, how retries or caching work), not a definition. No hints, no answer. Probe angles to choose from: "+TECH_Q.join("; ")+".\nReply with only JSON: {\"question\":\"...\"}","quick");
    ui.drill.question=String(r.question||"");ui.drill.status=ui.drill.question?"answering":"done";if(!ui.drill.question)ui.drill.err="No question came back. Try again.";
  }catch(e){ui.drill.status="done";ui.drill.err=errCopy(e)}
  render();
}
async function gradeDrill(){
  const d=ui.drill;if((d.answer||"").trim().length<30){d.err="Write a fuller answer before submitting.";render();return}
  d.status="grading";d.err="";render();
  try{
    const r=await askJson("You are a strict technical interviewer grading a product manager. Topic: "+d.name+". Question: "+d.question+"\nAnswer:\n"+d.answer.slice(0,5000)+"\n\nPass only if the answer is correct, concrete (names the mechanism, state location, failure handling where relevant) and would satisfy a backend engineer. Vague or definition-only answers do not pass.\nReply with only JSON: {\"pass\":true|false,\"feedback\":\"2-3 sentences\",\"gaps\":[\"specific missing point\", ...]}","default");
    d.result={pass:r.pass===true,feedback:String(r.feedback||""),gaps:(r.gaps||[]).slice(0,4).map(String)};
    if(d.result.pass){
      if(d.kind==="skill"){const st=S.skills[d.id]||(S.skills[d.id]={stage:0,passes:[],built:""});st.passes=(st.passes||[]).concat([{ts:Date.now(),q:d.question}])}
      else{const st=S.projects[d.id]||(S.projects[d.id]={items:{},passes:[]});st.passes=(st.passes||[]).concat([{ts:Date.now(),q:d.question}])}
      log("drill","Passed follow-up on "+d.name+": "+d.question,d.kind==="skill"?["tech"]:["building"]);
    }
    d.status="done";
  }catch(e){d.status="answering";d.err=errCopy(e)}
  render();
}
async function suggestQ(){
  const m=ui.mentor;const el=document.getElementById("mq");el.placeholder="Thinking…";
  try{
    const r=await askJson("Write ONE narrow, specific question a PM trainee should ask their mentor, based on this update. It must name a concrete artifact or reasoning step and ask where it is shallow or wrong (example style: 'I mapped referral attribution like this. Where is my technical reasoning still shallow?'). Not 'am I improving?'.\n\nLearned:\n"+m.learned+"\nBuilt:\n"+m.built+"\nImproved:\n"+m.improved+"\nStill weak:\n"+m.weak+"\nReply with only JSON: {\"question\":\"...\"}","quick");
    m.question=String(r.question||"");
  }catch(e){ui.msg=errCopy(e)}
  render();
}

route();
boot();
})();
